    :root{color-scheme:dark;--bg:#090909;--panel:#171717;--text:#f7f7f7;--muted:#a7a7a7;--line:#2a2a2a}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(980px,100%);margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) clamp(16px,4vw,32px) calc(30px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}.brand-lockup{display:inline-flex;align-items:center;gap:12px}.brand-lockup img{width:48px;height:auto;display:block}.brand-title{font-size:clamp(1.65rem,5vw,2.35rem);font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap}.subtitle{margin:10px 0 0;color:var(--muted);font-size:clamp(.82rem,2.8vw,1rem);line-height:1.5}.header-actions{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}.count{color:#777;font-weight:700;font-size:.82rem}.share-button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit;font-weight:800;cursor:pointer}.share-button:hover{filter:brightness(1.12)}.share-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.share-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.frg-language select{min-height:44px;padding:8px 34px 8px 11px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--panel);font:inherit;font-size:.8rem}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2.6vw,22px)}.game{min-width:0;display:block;border-radius:20px;outline:none}.cover{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 36px rgba(0,0,0,.32);transition:transform .18s ease,filter .18s ease}.game:hover .cover,.game:focus-visible .cover{transform:translateY(-4px);filter:brightness(1.08)}.game-title{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px;padding:0 2px;font-weight:800;font-size:clamp(.82rem,2.4vw,1.02rem);line-height:1.25}.arrow{font-size:1.35em;color:#ddd}.memory{background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18),transparent 25%),linear-gradient(155deg,#6f50d8,#39226e 48%,#15102e)}.memory-grid{position:absolute;inset:13% 12% 22%;display:grid;grid-template-columns:repeat(3,1fr);gap:7%;transform:rotate(-3deg)}.memory-grid i{display:grid;place-items:center;border-radius:12%;background:linear-gradient(145deg,#bca9ff,#7f66d9);box-shadow:0 8px 14px rgba(0,0,0,.24);font-style:normal;font-size:clamp(.8rem,4vw,2rem)}.memory-grid i:nth-child(2),.memory-grid i:nth-child(6),.memory-grid i:nth-child(7){background:linear-gradient(145deg,#fff0fb,#f0b4dc);color:#452655}.cover-logo{position:absolute;left:10%;right:10%;bottom:8%;font-weight:1000;font-size:clamp(.82rem,3.5vw,1.7rem);line-height:.95;letter-spacing:-.06em;text-transform:uppercase;text-shadow:0 3px 12px rgba(0,0,0,.4)}.rain{background:radial-gradient(circle at 78% 15%,rgba(255,255,255,.45),transparent 16%),linear-gradient(180deg,#87dcff,#3488d7 50%,#153b72)}.cloud{position:absolute;top:9%;left:12%;width:72%;height:14%;background:rgba(255,255,255,.88);border-radius:999px}.cloud:before,.cloud:after{content:"";position:absolute;bottom:0;background:inherit;border-radius:50%}.cloud:before{width:34%;aspect-ratio:1;left:12%;bottom:10%}.cloud:after{width:43%;aspect-ratio:1;right:13%;bottom:4%}.drop{position:absolute;display:grid;place-items:center;width:34%;aspect-ratio:1.18/1;border-radius:50% 50% 55% 55% / 38% 38% 66% 66%;color:#06365d;background:linear-gradient(160deg,#ebfbff,#76d8ff);font-weight:1000;font-size:clamp(.6rem,2.7vw,1.25rem);box-shadow:0 9px 18px rgba(0,36,86,.25)}.drop.one{left:10%;top:38%;transform:rotate(5deg)}.drop.two{right:8%;top:29%;transform:rotate(-6deg)}.drop.three{left:35%;top:58%;transform:rotate(3deg)}.max{background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.72),transparent 28%),linear-gradient(160deg,#eaf8ff,#a9ddff 50%,#6db8ef);color:#0d4168}.max-title{position:absolute;top:9%;left:9%;right:9%;font-size:clamp(.8rem,3.5vw,1.75rem);font-weight:1000;letter-spacing:-.06em;line-height:.9;text-transform:uppercase}.tiles{position:absolute;left:8%;right:8%;top:31%;bottom:13%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6%;transform:rotate(-4deg)}.tile{display:grid;place-items:center;border-radius:17%;background:#fff;border:2px solid rgba(35,112,164,.17);box-shadow:0 8px 16px rgba(26,89,135,.18);font-weight:1000;font-size:clamp(.8rem,4.3vw,2rem);color:#1269a5}.tile.op{background:#ffda66;color:#7a4b00}.tile.hot{background:#ff8e65;color:#fff}footer{margin-top:46px;padding-top:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.88rem}.home{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;color:#f1f1f1;font-weight:800}.home:hover{text-decoration:underline}.copyright{font-size:.76rem;color:#686868}@media(max-width:520px){.games{gap:10px}.cover{border-radius:14px}.game-title{margin-top:9px;font-size:.78rem}.frg-language select{max-width:150px;font-size:.72rem}}@media(max-width:360px){.games{gap:8px}.game-title{font-size:.7rem}}

<script>
const LANGS=[['ko','한국어'],['en','English'],['ja','日本語'],['zh-CN','简体中文'],['zh-TW','繁體中文'],['es','Español'],['pt-BR','Português (Brasil)'],['de','Deutsch'],['fr','Français'],['ru','Русский'],['it','Italiano'],['id','Bahasa Indonesia'],['th','ไทย'],['vi','Tiếng Việt']];
const I18N={
ko:{subtitle:'지능 · 학습 · 퍼즐 게임을 웹에서 바로 플레이하세요',count:'3 GAMES',share:'공유',games:'게임 목록',play:'플레이',home:'FiveRocksGames 홈페이지',copied:'미리보기 호환을 위해 링크만 복사했습니다.',copyFail:'공유 링크를 복사하지 못했습니다.'},
en:{subtitle:'Play intelligence, learning, and puzzle games right in your browser',count:'3 GAMES',share:'Share',games:'Game list',play:'Play',home:'FiveRocksGames Home',copied:'Link copied for preview compatibility.',copyFail:'Could not copy the share link.'},
ja:{subtitle:'知育・学習・パズルゲームをブラウザですぐ遊べます',count:'3 GAMES',share:'共有',games:'ゲーム一覧',play:'プレイ',home:'FiveRocksGames ホーム',copied:'共有リンクをコピーしました。',copyFail:'共有リンクをコピーできませんでした。'},
'zh-CN':{subtitle:'直接在浏览器中游玩益智、学习和解谜游戏',count:'3 款游戏',share:'分享',games:'游戏列表',play:'游玩',home:'FiveRocksGames 主页',copied:'已复制分享链接。',copyFail:'无法复制分享链接。'},
'zh-TW':{subtitle:'直接在瀏覽器中遊玩益智、學習與解謎遊戲',count:'3 款遊戲',share:'分享',games:'遊戲列表',play:'遊玩',home:'FiveRocksGames 首頁',copied:'已複製分享連結。',copyFail:'無法複製分享連結。'},
es:{subtitle:'Juega a juegos de inteligencia, aprendizaje y puzles directamente en tu navegador',count:'3 JUEGOS',share:'Compartir',games:'Lista de juegos',play:'Jugar',home:'Inicio de FiveRocksGames',copied:'Enlace copiado.',copyFail:'No se pudo copiar el enlace.'},
'pt-BR':{subtitle:'Jogue games de raciocínio, aprendizado e quebra-cabeça direto no navegador',count:'3 JOGOS',share:'Compartilhar',games:'Lista de jogos',play:'Jogar',home:'Início da FiveRocksGames',copied:'Link copiado.',copyFail:'Não foi possível copiar o link.'},
de:{subtitle:'Denk-, Lern- und Puzzlespiele direkt im Browser spielen',count:'3 SPIELE',share:'Teilen',games:'Spieleliste',play:'Spielen',home:'FiveRocksGames Startseite',copied:'Link kopiert.',copyFail:'Der Link konnte nicht kopiert werden.'},
fr:{subtitle:'Jouez à des jeux de réflexion, d’apprentissage et de puzzle directement dans le navigateur',count:'3 JEUX',share:'Partager',games:'Liste des jeux',play:'Jouer',home:'Accueil FiveRocksGames',copied:'Lien copié.',copyFail:'Impossible de copier le lien.'},

vi:{subtitle:'Chơi game tư duy, học tập và giải đố ngay trên trình duyệt',count:'3 TRÒ CHƠI',share:'Chia sẻ',games:'Danh sách trò chơi',play:'Chơi',home:'Trang chủ FiveRocksGames',copied:'Đã sao chép liên kết.',copyFail:'Không thể sao chép liên kết.'}
};
function normalize(v){v=(v||'').toLowerCase();if(v.startsWith('ko'))return'ko';if(v.startsWith('ja'))return'ja';if(v.startsWith('zh-hant')||v.startsWith('zh-tw')||v.startsWith('zh-hk')||v.startsWith('zh-mo'))return'zh-TW';if(v.startsWith('zh'))return'zh-CN';if(v.startsWith('es'))return'es';if(v.startsWith('pt'))return'pt-BR';if(v.startsWith('de'))return'de';if(v.startsWith('fr'))return'fr';if(v.startsWith('ru'))return'ru';if(v.startsWith('it'))return'it';if(v.startsWith('id'))return'id';if(v.startsWith('th'))return'th';if(v.startsWith('vi'))return'vi';return'en'}
const select=document.getElementById('languageSelect');LANGS.forEach(([code,label])=>{const o=document.createElement('option');o.value=code;o.textContent=label;select.appendChild(o)});
function applyLang(lang){if(!I18N[lang])lang='en';const t=I18N[lang];document.documentElement.lang=lang;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('gameCount').textContent=t.count;document.getElementById('shareText').textContent=t.share;document.getElementById('shareButton').setAttribute('aria-label',t.share);document.getElementById('gamesSection').setAttribute('aria-label',t.games);document.getElementById('homeLink').childNodes[0].nodeValue=t.home+' ';document.querySelectorAll('[data-game]').forEach(a=>a.setAttribute('aria-label',a.querySelector('.game-title span').textContent+' '+t.play));select.value=lang}
let lang=localStorage.getItem('frg-lang');if(!I18N[lang])lang=normalize(navigator.language);applyLang(lang);select.addEventListener('change',()=>{localStorage.setItem('frg-lang',select.value);applyLang(select.value)});
const shareButton=document.getElementById('shareButton'),shareStatus=document.getElementById('shareStatus'),shareUrl='https://fiverocksgames.github.io/game-hub/?share=20260831-approved-og';async function copyFallback(){await navigator.clipboard.writeText(shareUrl);shareStatus.textContent=I18N[select.value].copied}shareButton.addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({url:shareUrl});return}catch(e){if(e?.name==='AbortError')return}}try{await copyFallback()}catch(e){shareStatus.textContent=I18N[select.value].copyFail}});
</script>
