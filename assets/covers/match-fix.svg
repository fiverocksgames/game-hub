<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">Match Fix</title><desc id="desc">A matchstick puzzle game with a warm cream puzzle board against a deep brown background</desc>
<defs><radialGradient id="bg" cx=".75" cy=".15" r="1"><stop stop-color="#814221"/><stop offset=".58" stop-color="#3b2119"/><stop offset="1" stop-color="#1c171b"/></radialGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f4dfc1"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#f2c47d"/><stop offset=".6" stop-color="#cf9650"/><stop offset="1" stop-color="#b7773e"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#170a08" flood-opacity=".4"/></filter><g id="h"><rect x="0" y="-8" width="64" height="16" rx="8" fill="url(#wood)"/><circle cx="64" cy="0" r="9" fill="#ca3430"/><circle cx="62" cy="-2.5" r="3" fill="#e86d55"/></g><g id="v"><rect x="-8" y="0" width="16" height="64" rx="8" fill="url(#wood)"/><circle cx="0" cy="64" r="9" fill="#ca3430"/></g></defs>
<rect width="600" height="800" fill="url(#bg)"/>
<circle cx="535" cy="80" r="140" fill="#be792b" opacity=".09"/>
