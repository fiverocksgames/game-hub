<text x="51" y="648" fill="#fff0ca" font-family="Arial,sans-serif" font-weight="900" letter-spacing="-2" font-size="97">MATCH</text>
<text x="51" y="756" fill="#ffc46c" font-family="Arial,sans-serif" font-weight="900" letter-spacing="-2" font-size="118">FIX</text>
