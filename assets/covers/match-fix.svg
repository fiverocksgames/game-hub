<text x="300" y="148" text-anchor="middle" fill="#7c523a" font-family="Arial,sans-serif" font-weight="700" letter-spacing="3" font-size="17">MATCHSTICK PUZZLE</text>
<rect x="99" y="173" width="402" height="57" rx="28" fill="#f5e8d5" stroke="#dcc4a5"/>
<text x="300" y="209" text-anchor="middle" fill="#63402d" font-family="Arial,sans-serif" font-size="23" font-weight="800">MOVE 1 OR 2 MATCHES</text>
<rect x="79" y="258" width="442" height="236" rx="25" fill="#fffbf4" stroke="#e9d8c4"/>
<g transform="translate(103 318) scale(.72)" filter="url(#shadow)">
